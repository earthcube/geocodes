# Dagster workspace — two code locations running in PARALLEL:
#
#   pipeline  — phased ingest using the Gleaner container for harvest
#               (writes summoned/, enhanced/, graphs/latest/, ...)
#   pysummon  — python-native summoner (headless-capable, no Gleaner/Swarm)
#               writing under PYSUMMON_DATA_PREFIX (default pysummon/)
#
# Both read the same S3 configs (gleanerconfig/tenant/pipelineconfig.yaml)
# and crawl the same source list; outputs are isolated so results can be
# compared. To promote pysummon: set PYSUMMON_DATA_PREFIX="" in .env and
# pause the pipeline project's schedule in the Dagster UI.
#
# Both packages must be installed in the dagster-gleanerio image. To reload
# code: docker compose restart dagster-webserver dagster-daemon

load_from:
  - python_module:
      module_name: pipeline.definitions
      location_name: pipeline
  - python_module:
      module_name: pysummon.definitions
      location_name: pysummon
