# Gleaner configuration template for simplified geocodes deployment.
#
# SETUP:
#   1. Set active: true for the sources you want to crawl.
#   2. Upload to S3 before first Dagster run:
#        bash scripts/upload-configs.sh
#
# S3 credentials are injected by the Dagster scheduler (gleanerio.py) as
# container environment variables; leave the minio section blank here.
#
# Full source catalog: see dagster/implnets/configs/eco/gleanerconfig.yaml
# in the earthcube/scheduler repository.

context:
  cache: true
  strict: false
contextmaps:
  - prefix: "https://schema.org/"
    file: "/assets/schemaorg-current-https.jsonld"
  - prefix: "http://schema.org/"
    file: "/assets/schemaorg-current-http.jsonld"
gleaner:
  mill: true
  runid: runX
  summon: true
summoner:
  after: ""
  delay:
  headless: http://headless:9222
  mode: full
  threads: 5
  # pysummon fetch engine: crawl4ai (default; HTTP-only strategy or CDP
  # browser, retries on 429/503) or native (requests + Playwright). Can be
  # overridden per source with `fetcher: native`. Ignored by gleaner.
  engine: crawl4ai
millers:
  graph: true
minio:
  address:
  port:
  ssl:
  accessKey:
  secretKey:
  bucket:
sources:
  # ── Demo / test sources (small, good for initial verification) ──────────────
  - sourcetype: sitemap
    name: geocodes_demo_datasets
    logo: ""
    url: https://earthcube.github.io/GeoCODES-Metadata/metadata/Dataset/allgood/sitemap.xml
    headless: false
    pid: https://github.com/earthcube/GeoCODES-Metadata/metadata/OtherResources
    propername: Geocodes Demo Datasets
    domain: https://www.earthcube.org/datasets/
    active: true        # small demo dataset — good for first run verification
    credentialsfile: ""
    other: {}
    headlesswait: 0
    delay: 0
    identifierpath: ""
    apipagelimit: 0
    identifiertype: identifiersha
    fixcontextoption: 0
    acceptcontenttype: application/ld+json, text/html
    jsonprofile: application/ld+json

