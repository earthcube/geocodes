# Per-source pipeline step configuration for the phased ingest pipeline.
#
# Uploaded to s3://{bucket}/scheduler/configs/pipelineconfig.yaml by
# scripts/upload-configs.sh. This file is OPTIONAL — when absent, every
# source runs the default steps.
#
# Sources differ: some need context repair and blank-node skolemization,
# some need extra enhancement steps, some need none at all. Configure that
# here, per source, without touching code.
#
# Available steps (registered in workflows/pipeline/pipeline/steps.py):
#   fix_context          normalize/inject the schema.org @context
#   promote_identifiers  typed nodes without @id get a known persistent
#                        identifier (ORCID/ROR/DOI/re3data/wikidata) found in
#                        their own identifier/sameAs/url values
#   split_keywords       break comma/semicolon-packed keyword strings into
#                        arrays in the JSON-LD
#   skolemize            mint deterministic IRIs for the blank nodes left,
#                        from their attributes (name, url, title, value, @type)
#
# Settings:
#   steps:    ordered list of enhancement steps ([] = pass through untouched)
#   reports:  false to skip the community reports for this source
#   defaults.sparql_endpoint:  optional SPARQL bulk-update URL; when set, the
#             pysummon sparql_update_load asset POSTs each source's release
#             N-Quads there (Blazegraph/Fuseki). Leave unset for Qlever.
#
# This file is read by BOTH code locations. When defaults.steps is omitted,
# the gleaner pipeline uses [fix_context, skolemize] and pysummon uses
# [fix_context, promote_identifiers, split_keywords, skolemize].

defaults:
  reports: true
  # steps: [fix_context, promote_identifiers, split_keywords, skolemize]
  # sparql_endpoint: https://graph.example.org/blazegraph/namespace/x/sparql

sources:
  # use defaults unless listed here; examples:
  #
  # a source whose JSON-LD is already clean and fully identified:
  # some_clean_source:
  #   steps: []
  #
  # a source that only needs context repair, and no reports:
  # some_other_source:
  #   steps: [fix_context]
  #   reports: false
  geocodes_demo_datasets: {}
