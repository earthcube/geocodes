# Nginx reverse proxy for the geocodes simplified stack.
#
# Port 80 serves:
#   /          → FacetSearch Vue client (port 8080)
#   /ec/api/   → FacetSearch Node.js API (port 3000, prefix stripped)
#   /sparql    → Qlever SPARQL endpoint (port 7019)
#
# Dagster (port 3001) and Qlever UI (port 7000) are exposed directly
# and are NOT proxied through Nginx — they have their own port mappings
# in docker-compose.yaml.

upstream facetsearch_client {
    server facetsearch-client:8080;
}

upstream facetsearch_server {
    server facetsearch-server:3000;
}

upstream qlever {
    server qlever:7019;
}

server {
    listen 80;
    server_name _;

    # FacetSearch SPA — catch-all, serve from Vue client
    location / {
        proxy_pass         http://facetsearch_client;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # FacetSearch API — strip /ec/api prefix before forwarding
    location /ec/api/ {
        rewrite            ^/ec/api/(.*) /$1 break;
        proxy_pass         http://facetsearch_server;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        add_header         Access-Control-Allow-Origin  *;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header         Access-Control-Allow-Headers "Content-Type";
    }

    # Qlever SPARQL endpoint — browser calls this directly for all queries
    # TRIPLESTORE_URL in facetsearch/config.yaml should point here:
    #   http://<your-hostname>/sparql
    location /sparql {
        proxy_pass         http://qlever/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Qlever SPARQL responses can be large
        proxy_read_timeout 120s;
        add_header         Access-Control-Allow-Origin  *;
        add_header         Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header         Access-Control-Allow-Headers "Content-Type, Authorization";
    }
}
