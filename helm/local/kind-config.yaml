# kind cluster for testing the geocodes chart.
#
#   kind create cluster --config helm/local/kind-config.yaml
#
# The extraPortMappings bind the node's ingress ports to 8080/8443 on the host,
# so the ingress controller is reachable without port-forwarding.
#
# The chart's defaults assume Traefik (global.ingress.className=traefik and
# global.ingress.traefikMiddlewares=true).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: geocodes
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # Without this the ingress controller's Webhook/Service can't label the node.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # kind forwards a host port to a port on the node container, not into a pod.
    # NodePorts are the only port range that listens on the node itself, and
    # only 30000-32767 is allowed, so these line up with the NodePorts given to
    # the Traefik Service in the README (web=30080, websecure=30443).
    extraPortMappings:
      # http://*.localhost:8080
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Unused while global.ingress.tls is off, but mapped so enabling TLS later
      # doesn't need the cluster rebuilt.
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
