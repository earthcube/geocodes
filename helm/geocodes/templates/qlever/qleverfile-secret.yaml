{{- if .Values.qlever.enabled }}
{{- range .Values.qlever.projects }}
{{- $project := . }}
{{- $name := include "geocodes.componentName" (dict "root" $ "component" (printf "qlever-%s" .name)) }}
{{- $token := include "geocodes.secretValue" (dict "root" $ "secret" $name "key" "accessToken" "value" .accessToken "length" 32) }}
---
# The Qleverfile holds the server access token, so it is stored as a Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "geocodes.labels" (dict "root" $ "component" (printf "qlever-%s" .name)) | nindent 4 }}
type: Opaque
stringData:
  accessToken: {{ $token | quote }}
  Qleverfile: |
    {{- if .qleverfile }}
    {{- tpl .qleverfile (dict "Values" $.Values "Release" $.Release "Chart" $.Chart "Template" $.Template "project" $project "accessToken" $token) | nindent 4 }}
    {{- else }}
    [DEFAULT]
    NAME              = {{ .name }}
    SOURCES           = {{ join " " .sources }}

    [data]
    DESCRIPTION       = {{ .description }}
    TEXT_DESCRIPTION  = {{ .description }}
    FORMAT            = nq

    [index]
    INPUT_FILES       = ../release/*.nq
    CAT_INPUT_FILES   = for s in ${SOURCES}; do cat ../release/$${s}_*.nq; done
    VOCABULARY_TYPE   = on-disk-compressed-geo-split
    SETTINGS_JSON     = { "add-text-index": true, "ascii-prefixes-only": false, "num-triples-per-batch": 100000 }

    [server]
    PORT               = {{ $.Values.qlever.port }}
    ACCESS_TOKEN       = {{ $token }}
    MEMORY_FOR_QUERIES = {{ .memoryForQueries }}
    CACHE_MAX_SIZE     = {{ .cacheMaxSize }}
    TIMEOUT            = {{ .timeout }}

    [runtime]
    SYSTEM = native

    [ui]
    UI_CONFIG = default
    {{- end }}
{{- end }}
{{- end }}
