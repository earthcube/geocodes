{{- if and .Values.qlever.enabled .Values.qlever.petrimaps.enabled }}
{{- $pm := .Values.qlever.petrimaps }}
{{- $name := include "geocodes.componentName" (dict "root" . "component" "qlever-petrimaps") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "geocodes.labels" (dict "root" . "component" "qlever-petrimaps") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "geocodes.selectorLabels" (dict "root" . "component" "qlever-petrimaps") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geocodes.selectorLabels" (dict "root" . "component" "qlever-petrimaps") | nindent 8 }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.qlever.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: petrimaps
          image: {{ include "geocodes.image" $pm.image }}
          imagePullPolicy: {{ $pm.image.pullPolicy }}
          {{- /*
            Petrimaps is a middleware, not a browsable UI: / needs a ?query= and
            ?backend= and otherwise answers "No backend (?backend=) specified"
            (see the upstream README). The QLever UI adds both for its "Map view"
            button.

            The image is Entrypoint ["/usr/bin/dumb-init","--"], Cmd
            ["/qlever-petrimaps"]. Kubernetes `args` replaces Cmd, which would
            drop the binary and hand the flags to dumb-init, so set `command`
            with the full invocation instead.

            -x is the access token from the first graphspace's Qleverfile. With
            a token set, the backend must be registered once via POST /touch
            with a matching Authorization header, which the QLever UI does.
          */}}
          {{- $token := default (include "geocodes.qlever.defaultAccessToken" .) $pm.accessToken }}
          {{- $flags := list "-p" "9090" }}
          {{- with $pm.memory }}
          {{- $flags = concat $flags (list "-m" (toString .)) }}
          {{- end }}
          {{- if $token }}
          {{- $flags = concat $flags (list "-x" $token) }}
          {{- end }}
          command:
            - /qlever-petrimaps
          args:
            {{- toYaml $flags | nindent 12 }}
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: http
          {{- with $pm.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "geocodes.labels" (dict "root" . "component" "qlever-petrimaps") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "geocodes.selectorLabels" (dict "root" . "component" "qlever-petrimaps") | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- if $pm.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "geocodes.labels" (dict "root" . "component" "qlever-petrimaps") | nindent 4 }}
  {{- include "geocodes.ingress.annotations" (dict "root" . "annotations" $pm.ingress.annotations) | nindent 2 }}
spec:
  {{- include "geocodes.ingress.spec" (dict "root" . "host" (include "geocodes.host" (dict "root" . "values" $pm)) "path" "/" "service" $name "port" 9090 "tlsSecret" (printf "%s-tls" $name)) | nindent 2 }}
{{- end }}
{{- end }}
