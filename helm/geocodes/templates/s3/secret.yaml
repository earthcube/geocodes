{{- if and .Values.s3.enabled (not .Values.s3.auth.existingSecret) }}
{{- $name := include "geocodes.componentName" (dict "root" . "component" "s3") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "geocodes.labels" (dict "root" . "component" "s3") | nindent 4 }}
type: Opaque
data:
  accessKey: {{ include "geocodes.secretValue" (dict "root" . "secret" $name "key" "accessKey" "value" .Values.s3.auth.accessKey "length" 20) | b64enc | quote }}
  secretKey: {{ include "geocodes.secretValue" (dict "root" . "secret" $name "key" "secretKey" "value" .Values.s3.auth.secretKey "length" 40) | b64enc | quote }}
  {{- if .Values.s3.admin.enabled }}
  adminPassword: {{ include "geocodes.secretValue" (dict "root" . "secret" $name "key" "adminPassword" "value" .Values.s3.admin.password "length" 24) | b64enc | quote }}
  {{- end }}
{{- end }}
