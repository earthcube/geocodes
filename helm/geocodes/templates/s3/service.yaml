{{- if .Values.s3.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geocodes.componentName" (dict "root" . "component" "s3") }}
  labels:
    {{- include "geocodes.labels" (dict "root" . "component" "s3") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "geocodes.selectorLabels" (dict "root" . "component" "s3") | nindent 4 }}
  ports:
    - name: s3
      port: 8333
      targetPort: s3
    {{- if .Values.s3.admin.enabled }}
    - name: admin
      port: 23646
      targetPort: admin
    {{- end }}
{{- end }}
